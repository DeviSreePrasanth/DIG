name: Publish DBT to Artifact Registry

# Centralized model: all WIF + Artifact Registry live in the DSF hub projects.
# main    -> dsf-dev-poc  (dig-dbt repo)
# release -> dsf-prod-poc (dig-dbt repo)
on:
  push:
    branches: [main, release]
  workflow_dispatch:

# Required for Workload Identity Federation: lets the job mint an OIDC token.
permissions:
  id-token: write
  contents: read

# Non-secret resource identifiers (safe to hardcode). WIF + AR are in the DSF hub.
env:
  DEV_PROJECT_ID: dsf-dev-poc
  PROD_PROJECT_ID: dsf-prod-poc
  DEV_WIP: projects/637530616995/locations/global/workloadIdentityPools/github-pool/providers/github
  PROD_WIP: projects/1083911620746/locations/global/workloadIdentityPools/github-pool/providers/github
  SERVICE_ACCOUNT: gha-publisher@dsf-dev-poc.iam.gserviceaccount.com
  AR_LOCATION: us
  AR_REPO: dig-dbt
  # Module name namespaces this repo's models inside the shared Composer bucket.
  MODULE: dig
  DEV_BUCKET: dsf-dev-poc-composer-dbt
  PROD_BUCKET: dsf-prod-poc-composer-dbt

jobs:
  publish-dbt:
    runs-on: ubuntu-latest

    # A 'release' push maps to the 'prod' environment. Add required reviewers
    # in Settings > Environments > prod to gate production.
    environment: ${{ github.ref == 'refs/heads/release' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pick target DSF project + WIF provider based on the branch.
      - name: Resolve target environment
        id: env
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "project=${DEV_PROJECT_ID}"   >> "$GITHUB_OUTPUT"
            echo "wip=${DEV_WIP}"              >> "$GITHUB_OUTPUT"
            echo "bucket=${DEV_BUCKET}"        >> "$GITHUB_OUTPUT"
            echo "env_name=dev"                >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/release" ]; then
            echo "project=${PROD_PROJECT_ID}" >> "$GITHUB_OUTPUT"
            echo "wip=${PROD_WIP}"             >> "$GITHUB_OUTPUT"
            echo "bucket=${PROD_BUCKET}"       >> "$GITHUB_OUTPUT"
            echo "env_name=prod"               >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF} - refusing to deploy." >&2
            exit 1
          fi

      # Exchanges the GitHub OIDC token for a short-lived token, then
      # impersonates the central service account. No key file involved.
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ steps.env.outputs.project }}
          workload_identity_provider: ${{ steps.env.outputs.wip }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Package the dbt folder
        id: pkg
        run: |
          VERSION="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          tar -czf "dbt-${VERSION}.tar.gz" -C dbt .
          echo "Built dbt-${VERSION}.tar.gz"

      - name: Upload dbt artifact to Artifact Registry (generic repo)
        run: |
          gcloud artifacts generic upload \
            --project="${{ steps.env.outputs.project }}" \
            --location="${AR_LOCATION}" \
            --repository="${AR_REPO}" \
            --package="dig-dbt" \
            --version="${{ steps.pkg.outputs.version }}" \
            --source="dbt-${{ steps.pkg.outputs.version }}.tar.gz"

      # Deploy the LATEST artifact from Artifact Registry (source of truth) into a
      # single shared dbt/ folder in the Composer bucket, where all repos merge.
      # Step 1: upload shared project files + this module's models with NO delete
      #         (so it never removes other repos' files in the shared folder).
      # Step 2: reconcile THIS module's models subtree with a scoped delete, so
      #         files removed from this repo are cleaned up without touching others.
      - name: Deploy latest AR artifact to Composer bucket
        id: deploy
        run: |
          set -e
          LATEST="$(gcloud artifacts versions list \
            --project='${{ steps.env.outputs.project }}' --location="${AR_LOCATION}" \
            --repository="${AR_REPO}" --package="${AR_REPO}" \
            --sort-by=~CREATE_TIME --limit=1 --format='value(name)')"
          LATEST="${LATEST##*/}"   # keep only the version id
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest ${AR_REPO} version: ${LATEST}"

          rm -rf pull extracted && mkdir -p pull extracted
          gcloud artifacts generic download \
            --project='${{ steps.env.outputs.project }}' --location="${AR_LOCATION}" \
            --repository="${AR_REPO}" --package="${AR_REPO}" \
            --version="${LATEST}" --destination=pull
          tar -xzf pull/*.tar.gz -C extracted

          BUCKET="gs://${{ steps.env.outputs.bucket }}/dbt"
          gcloud storage rsync extracted "${BUCKET}" \
            --recursive --checksums-only
          gcloud storage rsync "extracted/models/${MODULE}" "${BUCKET}/models/${MODULE}" \
            --recursive --checksums-only --delete-unmatched-destination-objects

      - name: Summary
        run: |
          echo "Published dig-dbt version ${{ steps.pkg.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "to ${{ steps.env.outputs.env_name }} hub project ${{ steps.env.outputs.project }} (repo ${AR_REPO})" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed AR version ${{ steps.deploy.outputs.version }} -> gs://${{ steps.env.outputs.bucket }}/dbt (models/${MODULE})" >> "$GITHUB_STEP_SUMMARY"
